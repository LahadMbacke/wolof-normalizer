[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolof-normalizer"
version = "0.2.0"
description = "Normalise Wolof text written in French-style / SMS spelling into the official orthography (CLAD)."
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Baye Lahad Mbacke" }]
requires-python = ">=3.10"
keywords = ["wolof", "nlp", "normalization", "spelling", "low-resource", "senegal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/LahadMbacke/wolof-normalizer"
Model = "https://huggingface.co/Lahad/wolof-normalizer-byt5-small"
Dataset = "https://huggingface.co/datasets/Lahad/wolof-normalization-pairs"

[project.optional-dependencies]
model = ["torch>=2.6", "transformers>=5"]
dev = ["pytest"]
eval = ["pyarrow"]

[project.scripts]
wolof-normalize = "wolof_normalizer.cli:main"

[tool.setuptools.package-data]
wolof_normalizer = ["data/*.tsv", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
