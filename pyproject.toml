[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolof-normalizer"
version = "0.1.0"
description = "Normalise Wolof text written in French-style / SMS spelling into the official orthography (CLAD)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Baye Lahad Mbacke" }]
requires-python = ">=3.9"
keywords = ["wolof", "nlp", "normalization", "spelling", "low-resource"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wolof-normalize = "wolof_normalizer.cli:main"

[tool.setuptools.package-data]
wolof_normalizer = ["data/*.tsv", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
